source [file join [file dirname [info script]] hpm5361.cfg]
cmsis-dap backend usb_bulk
cmsis-dap vid_pid 0x1209 0x6666
# 连接多个探针时，通过 ROBOT_PROBE_SERIAL 选择目标探针。
if {[info exists ::env(ROBOT_PROBE_SERIAL)] && $::env(ROBOT_PROBE_SERIAL) ne ""} {
    adapter serial $::env(ROBOT_PROBE_SERIAL)
}
adapter speed 10
